<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Telinha</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box;
      background: radial-gradient(60% 50% at 50% 0, rgba(168, 85, 247, .2), transparent 70%), #07080d;
      color: #eef1ff; font: 400 16px/1.5 "Barlow", "Segoe UI", system-ui, sans-serif;
    }
    h1 { margin: 0 0 10px; font: italic 800 44px/1 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; }
    p { margin: 0 0 26px; color: #9aa3c0; max-width: 42ch; }
    button {
      height: 46px; padding: 0 26px; border: 0; cursor: pointer; color: #050608;
      background: linear-gradient(100deg, #22d3ee, #a855f7); font: 700 16px "Barlow Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
  </style>
</head>
<body>
  <div>
    <h1>Sem conexão</h1>
    <p>Não deu para abrir o Telinha. Confira a internet e tente de novo.</p>
    <button id="retry" type="button">Tentar de novo</button>
  </div>
  <script src="offline.js"></script>
</body>
</html>
